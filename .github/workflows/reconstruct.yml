name: Expand PCCO production source
on:
  push:
    branches: [pcco-stays-production]
permissions:
  contents: write
jobs:
  expand:
    if: ${{ hashFiles('.pcco-source/pcco-src.part-*') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct approved source
        shell: bash
        run: |
          set -euo pipefail
          cat .pcco-source/pcco-src.part-* > /tmp/pcco-source.zip
          mkdir -p /tmp/pcco-source
          unzip -q /tmp/pcco-source.zip -d /tmp/pcco-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pcco-source/. .
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PCCO Stays approved production website"
          git push origin HEAD:pcco-stays-production
